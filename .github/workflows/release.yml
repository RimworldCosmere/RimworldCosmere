name: Publish Cosmere Mods to GitHub

on:
  release:
    types:
      - published
  push:
    branches:
      - 'main'
      - 'beta'
      - 'alpha'

#permissions:
#  contents: write # to be able to publish a GitHub release
#  issues: write # to be able to comment on released issues
#  pull-requests: write # to be able to comment on released pull requests
#  id-token: write # to enable use of OIDC for npm provenance

jobs:
  # Determine which Cosmere mods need to be built.
  get-mods:
    runs-on: ubuntu-latest
    outputs:
      mods: ${{ steps.set-mods.outputs.mods }}
    steps:
      - name: Validate Git tag format
        if: github.event.release.tag_name != ''
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION=${TAG#v}  # strip leading 'v' if present

          echo "Checking tag format: $VERSION"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-alpha|-beta)?$ ]]; then
            echo "❌ Invalid tag format: '$VERSION'"
            echo "Expected: MAJOR.MINOR.PATCH[.REVISION][-alpha|-beta]"
            exit 1
          fi

          echo "✅ Tag format valid."

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine Cosmere mods
        id: set-mods
        run: |
          # Only include directories with About/About.xml (actual RimWorld mods)
          mods=$(find . -maxdepth 1 -type d -name "Cosmere*" | while read dir; do
            if [ -f "$dir/About/About.xml" ]; then
              basename "$dir"
            fi
          done | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "mods=$mods" >> "$GITHUB_OUTPUT"
          echo "Found mods: $mods"


  # Build all asset bundles for all platforms in a single job
  build-assetbundles:
    needs: get-mods
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout RimworldCosmere
        uses: actions/checkout@v4

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          
      - name: Install dotnet-script
        run: dotnet tool install --global dotnet-script

          
      - uses: buildalon/unity-setup@v1
        with:
          unity-version: 2022.3.35f1
          build-targets: StandaloneWindows64 StandaloneOSX StandaloneLinux64
          modules: windows-mono mac-mono linux-il2cpp

      - uses: buildalon/activate-unity-license@v1
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Configure AssetBundleBuilder for CI
        run: |
          # In CI, use copy instead of junction/symlink for reliability
          sed -i 's/link_method = "junction"/link_method = "copy"/' .assetbundler.toml
          echo "Updated .assetbundler.toml for CI environment:"
          grep -E "link_method|unity_args" .assetbundler.toml

      - name: Build AssetBundles for all platforms
        run: make build-assets-all-verbose

      - name: Archive and upload asset bundles
        run: |
          for modDir in Cosmere*/; do
            if [ -d "$modDir/AssetBundles" ]; then
              modName=$(basename "$modDir")
              echo "Archiving $modName asset bundles..."
              cd "$modDir"
              zip -r "../${modName}-assetbundles.zip" AssetBundles
              cd ..
            fi
          done
          
      - name: Upload asset bundles artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-assetbundles
          path: "*-assetbundles.zip"

  prepare:
    needs: [ get-mods, build-assetbundles ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mod: ${{ fromJson(needs.get-mods.outputs.mods) }}
    
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      MOD: ${{ matrix.mod }}
      BUNDLE_NAME: ${{ matrix.mod }}
      TEMP_DIR: "/tmp/${{ matrix.mod }}_upload"
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}

    steps:
      - name: Set BUNDLE_NAME
        run: |
          short="${MOD#Cosmere}"
          short="${short,,}"  # lowercase it
          echo "BUNDLE_NAME=cosmere.$short" >> $GITHUB_ENV
        env:
          MOD: ${{ matrix.mod }}

      - name: Checkout RimworldCosmere
        uses: actions/checkout@v4
        with:
          path: 'RimworldCosmere'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install steamdown + steam-totp
        working-directory: RimworldCosmere
        run: npm install -g @steamdown/cli tsx

      - name: Run code generation
        working-directory: RimworldCosmere
        run: make generate

      - name: Restore solution dependencies
        working-directory: RimworldCosmere
        run: dotnet restore Cosmere.sln

      - name: Set build configuration
        working-directory: RimworldCosmere
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "BUILD=Release" >> $GITHUB_ENV
          else
            echo "BUILD=Debug" >> $GITHUB_ENV
          fi

      # Download and extract asset bundles built in the previous job.  The
      # artifact contains zips of all AssetBundles directories.  After
      # extraction the bundles live under RimworldCosmere/$MOD/AssetBundles
      # so that the packaging step will include them automatically.
      - name: Download asset bundles
        uses: actions/download-artifact@v4
        with:
          name: all-assetbundles
          path: RimworldCosmere

      - name: Extract asset bundles
        working-directory: RimworldCosmere
        run: |
          if [ -f "$MOD-assetbundles.zip" ]; then
            echo "Extracting $MOD-assetbundles.zip to $MOD/"
            unzip -o "$MOD-assetbundles.zip" -d "$MOD/"
            rm "$MOD-assetbundles.zip"
          else
            echo "No asset bundles found for $MOD (this is fine if mod has no Assets)"
          fi

      - name: Build solution (tagged release)
        working-directory: RimworldCosmere
        if: ${{ github.event.release.tag_name != '' }}
        run: |
          TAG="${{ github.event.release.tag_name }}" # e.g. v1.6.0-beta or 1.6.0.1
          VERSION="${TAG#v}"                         # strip leading 'v'

          # Extract components with known-good format
          REGEX='^([0-9]+)\.([0-9]+)\.([0-9]+)(-alpha|-beta)?(\.[0-9]+)?$'
          [[ "$VERSION" =~ $REGEX ]]

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          LABEL="${BASH_REMATCH[4]#-}"         # optional, strip leading dash
          REVISION="${BASH_REMATCH[5]#.}"      # optional, strip leading dot
          [[ -z "$REVISION" ]] && REVISION="0" # default REVISION to `0`

          CONFIG="Debug"
          [[ -z "$LABEL" && "${GITHUB_REF_NAME}" == "main" ]] && CONFIG="Release"

          BUILD_VERSION="$MAJOR.$MINOR.$PATCH"
          [[ -n "$REVISION" ]] && BUILD_VERSION+=".$REVISION"
          [[ -n "$LABEL" ]] && BUILD_VERSION+="-${LABEL}"

          echo "Building Cosmere.sln@$BUILD_VERSION ($CONFIG)"

          dotnet build Cosmere.sln \
            --configuration "$CONFIG" \
            -p:Version="$BUILD_VERSION" \
            -p:FileVersion="$BUILD_VERSION" \
            -p:AssemblyVersion="$MAJOR.$MINOR.$PATCH.0" \
            -p:InformationalVersion="$BUILD_VERSION" \
            --no-restore

      - name: Build solution (non-tagged)
        if: ${{ github.ref_type != 'tag' }}
        working-directory: RimworldCosmere
        run: dotnet build Cosmere.sln --configuration Debug --no-restore

      - name: Verify Cosmere.dll exists
        working-directory: RimworldCosmere
        run: |
          # The csproj has <OutDir>..\Assemblies\</OutDir> so it builds directly to CosmereCore/Assemblies/
          DLL_PATH="CosmereCore/Assemblies/Cosmere.dll"

          if [ ! -f "$DLL_PATH" ]; then
            echo "❌ Error: Cosmere.dll not found at $DLL_PATH"
            ls -la CosmereCore/Assemblies/ || echo "Assemblies directory doesn't exist"
            exit 1
          fi

          echo "✓ Found Cosmere.dll at $DLL_PATH"
          ls -lh "$DLL_PATH"

      - name: Prepare upload directory
        id: prepare
        working-directory: RimworldCosmere
        run: |
          FILE_ID="$(cat $MOD/About/PublishedFileId.txt 2>/dev/null || printf '')"
          DESCRIPTION_FILE="$TEMP_DIR/steam_description.txt"

          mkdir -p "$TEMP_DIR"

          echo "📄 Generating description for $MOD..."
          if [ -f "$MOD/README.md" ]; then
            cat "$MOD/README.md" | steamdown > "$DESCRIPTION_FILE"
          else
            echo "No description available." > "$DESCRIPTION_FILE"
          fi

          echo "🚫 Respecting .steamignore..."
          if [ -f "$MOD/.steamignore" ]; then
            rsync -av --exclude-from="$MOD/.steamignore" --exclude=".steamignore" "$MOD/" "$TEMP_DIR"
          else
            rsync -av "$MOD/" "$TEMP_DIR"
          fi

          CHANGE_NOTE=$(git log -1 --pretty=%B | sed 's/"/\\"/g')
          ESCAPED_DESCRIPTION=$(sed 's/"/\\"/g' "$DESCRIPTION_FILE")

          {
            echo '"workshopitem"'
            echo '{'
            echo '  "appid" "294100"'
            echo "  \"publishedfileid\" \"$FILE_ID\""
            echo "  \"contentfolder\" \"$TEMP_DIR\""
            echo "  \"changenote\" \"$CHANGE_NOTE\""
            echo "  \"description\" \"$ESCAPED_DESCRIPTION\""
            echo '}'
          } > "$TEMP_DIR/workshop.vdf"

          echo "✅ Generated workshop.vdf for $MOD:"
          cat "$TEMP_DIR/workshop.vdf"

          ZIP_PATH="${{ github.workspace }}/${MOD}-${BRANCH_NAME}.zip"
          cd "$TEMP_DIR"
          zip -r "$ZIP_PATH" .

          echo "vdfpath=$TEMP_DIR/workshop.vdf" >> "$GITHUB_OUTPUT"

      - uses: buildalon/setup-steamcmd@v1
        name: Setup SteamCMD
        if: ${{ github.event_name == 'release' && !endsWith(github.event.release.tag_name, '-beta') && !endsWith(github.event.release.tag_name, '-alpha') }}
        id: steam-setup

      - uses: CyberAndrii/steam-totp@v1
        name: Generate TOTP
        if: ${{ github.event_name == 'release' && !endsWith(github.event.release.tag_name, '-beta') && !endsWith(github.event.release.tag_name, '-alpha') }}
        id: steam-totp
        with:
          shared_secret: ${{ secrets.STEAM_SHARED_SECRET }}
      - name: Upload with SteamCMD
        if: ${{ github.event_name == 'release' && !endsWith(github.event.release.tag_name, '-beta') && !endsWith(github.event.release.tag_name, '-alpha') }}
        run: ~/steamcmd/steamcmd.sh +login "$STEAM_USERNAME" "$STEAM_PASSWORD" ${{ steps.steam-totp.outputs.code }} +workshop_build_item "${{ steps.prepare.outputs.vdfpath }}" +quit

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mod }}-zip
          path: ${{ github.workspace }}/${{ matrix.mod }}-${{ env.BRANCH_NAME }}.zip
  
  semantic-release:
    needs: prepare
    if: needs.prepare.result == 'success' && github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Download all zip artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-zip'
          path: ./zips
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          npm install @semantic-release/git semantic-release-replace-plugin -D
          npx semantic-release