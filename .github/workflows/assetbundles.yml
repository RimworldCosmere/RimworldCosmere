name: Asset bundles

on:
  workflow_call:
    outputs:
      artifact:
        description: The artifact name holding one zip per mod.
        value: all-assetbundles

jobs:
  build-assetbundles:
    name: Build asset bundles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RimworldCosmere
        uses: actions/checkout@v5

      - name: Restore AssetBundles cache
        id: assetbundle-cache
        uses: actions/cache@v5
        with:
          path: |
            CosmereCore/AssetBundles
            CosmereRoshar/AssetBundles
            CosmereScadrial/AssetBundles
          key: ${{ runner.os }}-assetbundles-${{ hashFiles('.assetbundler.toml', 'Cosmere*/.assetbundler.toml', 'scripts/build-assets.csx', 'Makefile', 'Cosmere*/Assets/**') }}

      - name: Setup Dotnet
        if: steps.assetbundle-cache.outputs.cache-hit != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install dotnet-script
        if: steps.assetbundle-cache.outputs.cache-hit != 'true'
        run: dotnet tool install --global dotnet-script


      # hub 3.20.0 against unity-setup's pre-3.20 assumptions. the symlink must stay dangling
      # or the action skips its own installer, and the shim drops an [install-state] line that
      # breaks its strict `editors -i` parser. delete both on buildalon/unity-setup#57.
      - name: Adapt Unity Hub 3.20.0 to what unity-setup expects
        if: steps.assetbundle-cache.outputs.cache-hit != 'true'
        run: |
          sudo ln -sfn /usr/lib/unityhub /opt/unityhub
          sudo mkdir -p /opt/hub-shim
          sudo tee /opt/hub-shim/unity-hub >/dev/null <<'SH'
          #!/bin/bash
          "${UNITY_HUB_REAL:-/usr/bin/unity-hub}" "$@" | grep -v --line-buffered '^\[install-state\]'
          exit "${PIPESTATUS[0]}"
          SH
          sudo chmod 755 /opt/hub-shim/unity-hub
          echo /opt/hub-shim >> "$GITHUB_PATH"

          printf '#!/bin/bash\necho "[install-state] pruned 3 rows"\necho "2022.3.35f1 installed at /tmp/u"\nexit 4\n' > /tmp/fake-hub
          chmod 755 /tmp/fake-hub
          rc=0
          out=$(UNITY_HUB_REAL=/tmp/fake-hub /opt/hub-shim/unity-hub) || rc=$?
          [ "$rc" = 4 ] || { echo "shim dropped the hub exit code, got $rc"; exit 1; }
          [ "$out" = "2022.3.35f1 installed at /tmp/u" ] || { echo "shim filtered wrong, got: $out"; exit 1; }
          echo "shim self-test ok"

      - name: Verify the shim is intercepting unity-hub
        if: steps.assetbundle-cache.outputs.cache-hit != 'true'
        run: |
          resolved=$(command -v unity-hub || true)
          [ "$resolved" = /opt/hub-shim/unity-hub ] || { echo "PATH resolved unity-hub to '$resolved'"; exit 1; }

      - uses: buildalon/unity-setup@v1
        if: steps.assetbundle-cache.outputs.cache-hit != 'true'
        with:
          unity-version: 2022.3.35f1
          build-targets: StandaloneWindows64 StandaloneOSX StandaloneLinux64
          modules: windows-mono mac-mono linux-il2cpp
          cache-installation: 'true'
          auto-update-hub: 'false'

      - uses: buildalon/activate-unity-license@v1
        if: steps.assetbundle-cache.outputs.cache-hit != 'true'
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Configure AssetBundleBuilder for CI
        if: steps.assetbundle-cache.outputs.cache-hit != 'true'
        run: |
          # In CI, use copy instead of junction/symlink for reliability
          sed -i 's/link_method = "junction"/link_method = "copy"/' .assetbundler.toml
          echo "Updated .assetbundler.toml for CI environment:"
          grep -E "link_method|unity_args" .assetbundler.toml

      - name: Build AssetBundles for all platforms
        if: steps.assetbundle-cache.outputs.cache-hit != 'true'
        run: make build-assets-all-verbose

      - name: Archive and upload asset bundles
        run: |
          if [ "${{ steps.assetbundle-cache.outputs.cache-hit }}" = 'true' ]; then
            echo "Reusing cached AssetBundles"
          fi
          for modDir in Cosmere*/; do
            if [ -d "$modDir/AssetBundles" ]; then
              modName=$(basename "$modDir")
              echo "Archiving $modName asset bundles..."
              cd "$modDir"
              zip -r "../${modName}-assetbundles.zip" AssetBundles
              cd ..
            fi
          done

          
      - name: Upload asset bundles artifacts
        uses: actions/upload-artifact@v5
        with:
          name: all-assetbundles
          path: "*-assetbundles.zip"
