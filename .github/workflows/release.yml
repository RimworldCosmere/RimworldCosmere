name: Publish Cosmere Mods to GitHub

on:
  release:
    types:
      - published
  push:
    branches:
      - 'main'
      - 'beta'
      - 'alpha'

jobs:
  # Determine which Cosmere mods need to be built.
  get-mods:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mods: ${{ steps.set-mods.outputs.mods }}
    steps:
      - name: Validate Git tag format
        if: github.event.release.tag_name != ''
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION=${TAG#v}  # strip leading 'v' if present

          echo "Checking tag format: $VERSION"

          # Supports semantic-release formats:
          # - 1.7.0 (stable)
          # - 1.7.0-beta.1, 1.7.0-alpha.3 (prerelease with increment)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?$ ]]; then
            echo "❌ Invalid tag format: '$VERSION'"
            echo "Expected: MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-beta.N or MAJOR.MINOR.PATCH-alpha.N"
            exit 1
          fi

          echo "✅ Tag format valid."

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Determine Cosmere mods
        id: set-mods
        run: |
          # Only include directories with About/About.xml (actual RimWorld mods)
          mods=$(find . -maxdepth 1 -type d -name "Cosmere*" | while read dir; do
            if [ -f "$dir/About/About.xml" ]; then
              basename "$dir"
            fi
          done | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "mods=$mods" >> "$GITHUB_OUTPUT"
          echo "Found mods: $mods"


  game-image:
    name: RimWorld image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-ref: ${{ steps.image.outputs.image-ref }}
    steps:
      - name: Build the RimWorld game image
        id: image
        uses: RimWorks/steam-game-image-action@v4
        with:
          steam-username: ${{ secrets.STEAM_USERNAME }}
          steam-config-vdf: ${{ secrets.STEAM_CONFIG_VDF_B64 }}
          branch: 'unstable'
          variant: linux
          image: ghcr.io/${{ github.repository_owner }}/rimworld-game-runnable
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          skip-if-unchanged: 'false'

  prepare:
    needs: [ get-mods, game-image ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        mod: ${{ fromJson(needs.get-mods.outputs.mods) }}
    
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      MOD: ${{ matrix.mod }}
      BUNDLE_NAME: ${{ matrix.mod }}

    steps:
      - name: Set BUNDLE_NAME
        run: |
          short="${MOD#Cosmere}"
          short="${short,,}"  # lowercase it
          echo "BUNDLE_NAME=cosmere.$short" >> $GITHUB_ENV
        env:
          MOD: ${{ matrix.mod }}

      - name: Checkout RimworldCosmere
        uses: actions/checkout@v5
        with:
          path: 'RimworldCosmere'

      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install steamdown + steam-totp
        working-directory: RimworldCosmere
        run: npm install -g --ignore-scripts @steamdown/cli@1.0.0 tsx@4.23.15

      - name: Stage game assemblies
        id: refs
        uses: RimWorks/mod-ci/.github/actions/stage-game-refs@v5
        with:
          image: ${{ needs.game-image.outputs.image-ref }}

      - name: Point msbuild at the refs
        run: echo "GameManagedDir=${{ steps.refs.outputs.managed-dir }}" >> "$GITHUB_ENV"

      - name: Run code generation
        working-directory: RimworldCosmere
        env:
          BETA_HUB_IN_GAME_KEY: ${{ secrets.BETA_HUB_IN_GAME_KEY }}
        run: make generate

      - name: Restore solution dependencies
        working-directory: RimworldCosmere
        run: dotnet restore Cosmere.slnx

      - name: Set build configuration
        working-directory: RimworldCosmere
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "BUILD=Release" >> $GITHUB_ENV
          else
            echo "BUILD=Debug" >> $GITHUB_ENV
          fi


      - name: Build solution (tagged release)
        working-directory: RimworldCosmere
        if: ${{ github.event.release.tag_name != '' }}
        run: |
          TAG="${{ github.event.release.tag_name }}" # e.g. 1.7.0 or 1.7.0-beta.1
          VERSION="${TAG#v}"                         # strip leading 'v'

          # Extract components - supports semantic-release format: 1.7.0-beta.1
          REGEX='^([0-9]+)\.([0-9]+)\.([0-9]+)(-(alpha|beta)\.([0-9]+))?$'
          [[ "$VERSION" =~ $REGEX ]]

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          LABEL="${BASH_REMATCH[5]}"           # alpha or beta (empty for stable)
          REVISION="${BASH_REMATCH[6]:-0}"     # prerelease increment, default 0

          CONFIG="Debug"
          [[ -z "$LABEL" && "${GITHUB_REF_NAME}" == "main" ]] && CONFIG="Release"

          # Build version: use full semantic version for dotnet
          BUILD_VERSION="$VERSION"

          echo "Building Cosmere.slnx@$BUILD_VERSION ($CONFIG)"

          dotnet build Cosmere.slnx \
            --configuration "$CONFIG" \
            -p:Version="$BUILD_VERSION" \
            -p:FileVersion="$MAJOR.$MINOR.$PATCH.$REVISION" \
            -p:AssemblyVersion="$MAJOR.$MINOR.$PATCH.0" \
            -p:InformationalVersion="$BUILD_VERSION" \
            --no-restore

      - name: Build solution (non-tagged)
        if: ${{ github.ref_type != 'tag' }}
        working-directory: RimworldCosmere
        run: dotnet build Cosmere.slnx --configuration Debug --no-restore

      - name: Verify Cosmere.dll exists
        working-directory: RimworldCosmere
        run: |
          # The csproj has <OutDir>..\Assemblies\</OutDir> so it builds directly to CosmereCore/Assemblies/
          DLL_PATH="CosmereCore/Assemblies/Cosmere.dll"

          if [ ! -f "$DLL_PATH" ]; then
            echo "❌ Error: Cosmere.dll not found at $DLL_PATH"
            ls -la CosmereCore/Assemblies/ || echo "Assemblies directory doesn't exist"
            exit 1
          fi

          echo "✓ Found Cosmere.dll at $DLL_PATH"
          ls -lh "$DLL_PATH"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Bake the asset pack
        working-directory: RimworldCosmere
        env:
          GAME_IMAGE: ${{ needs.game-image.outputs.image-ref }}
        run: |
          docker run --rm \
            --entrypoint /game/RimWorld \
            -u "$(id -u):$(id -g)" \
            --tmpfs /tmp/home:exec,mode=1777 \
            -e HOME=/tmp/home \
            -e XDG_CONFIG_HOME=/tmp/home \
            -e XDG_CACHE_HOME=/tmp/home \
            -e XDG_DATA_HOME=/tmp/home \
            -v "$PWD/$MOD:/bake/$MOD" \
            "$GAME_IMAGE" \
            -Headless -NoFileLog -BakeModAssetPacks="/bake/$MOD"

          ls -lh "$MOD/Assets.zip" "$MOD/Assets.zip.fingerprint"

      - name: Prepare upload directory
        working-directory: RimworldCosmere
        run: |
          ZIP_PATH="${{ github.workspace }}/${MOD}-${BRANCH_NAME}.zip"
          zip -r "$ZIP_PATH" "$MOD"

          echo "✅ Generated zip artifact for $MOD at $ZIP_PATH"
          ls -lh "$ZIP_PATH"


      - name: Upload zip artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.mod }}-zip
          path: ${{ github.workspace }}/${{ matrix.mod }}-${{ env.BRANCH_NAME }}.zip
  
  semantic-release:
    needs: prepare
    if: needs.prepare.result == 'success' && github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
    outputs:
      published: ${{ steps.after.outputs.published }}
      version: ${{ steps.after.outputs.version }}
      tag: ${{ steps.after.outputs.tag }}
      previous-tag: ${{ steps.before.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install release dependencies
        run: npm ci --ignore-scripts
      - name: Download all zip artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: '*-zip'
          path: ./zips
          merge-multiple: true
      - name: Record the tag before releasing
        id: before
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          BETA_HUB_API_KEY: ${{ secrets.BETA_HUB_API_KEY }}
          SPLIT_PUBLISH: '1'
        # --no runs the copy npm ci installed and fails if it is missing, instead of fetching
        # an unpinned semantic-release off the registry and running its lifecycle scripts.
        run: npx --no semantic-release

      - name: Read the tag it just cut
        id: after
        run: |
          tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ "$tag" = "${{ steps.before.outputs.tag }}" ] || [ -z "$tag" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: semantic-release
    if: needs.semantic-release.outputs.published == 'true'
    uses: RimWorks/mod-ci/.github/workflows/publish.yml@v5
    permissions:
      contents: read
    secrets:
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
      STEAM_CONFIG_VDF_B64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    with:
      version: ${{ needs.semantic-release.outputs.version }}
      branch: ${{ github.ref_name }}
      zip-artifact-pattern: '*-zip'
      discord-mod-name: Cosmere
      discord-workshop-id: Core=3474223604, Scadrial=3474236328, Roshar=3706867006
      discord-embed-color: E67E22
      tag: ${{ needs.semantic-release.outputs.tag }}
      previous-tag: ${{ needs.semantic-release.outputs.previous-tag }}
