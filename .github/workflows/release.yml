name: Publish Cosmere Mods to GitHub

on:
  release:
    types:
      - published
  push:
    branches:
      - 'main'
      - 'beta'
      - 'alpha'

#permissions:
#  contents: write # to be able to publish a GitHub release
#  issues: write # to be able to comment on released issues
#  pull-requests: write # to be able to comment on released pull requests
#  id-token: write # to enable use of OIDC for npm provenance

jobs:
  # Determine which Cosmere mods need to be built.
  get-mods:
    runs-on: ubuntu-latest
    outputs:
      mods: ${{ steps.set-mods.outputs.mods }}
    steps:
      - name: Validate Git tag format
        if: github.event.release.tag_name != ''
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION=${TAG#v}  # strip leading 'v' if present

          echo "Checking tag format: $VERSION"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-alpha|-beta)?$ ]]; then
            echo "❌ Invalid tag format: '$VERSION'"
            echo "Expected: MAJOR.MINOR.PATCH[.REVISION][-alpha|-beta]"
            exit 1
          fi

          echo "✅ Tag format valid."

      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Determine changed Cosmere mods
        id: set-mods
        run: |
          mods=$(find . -maxdepth 1 -type d -name "Cosmere*" -exec basename {} \; | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "mods=$mods" >> "$GITHUB_OUTPUT"


  # The job runs sequentially across mods (max‑parallel: 1) so that
  # Unity licence activation and asset copying do not step on each
  # other.  Built bundles are zipped and uploaded as artifacts
  # available to subsequent jobs.
  build-assetbundles:
    needs: get-mods
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mod: ${{ fromJson(needs.get-mods.outputs.mods) }}
        # Build bundles for each platform separately.  Each matrix entry
        # will contain a mod and a platform (windows, mac, linux).
        platform: [ windows, mac, linux ]
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      MOD: ${{ matrix.mod }}
      BUNDLE_NAME: ${{ matrix.mod }}
    steps:
      #- name: Free Disk Space (Ubuntu)
      #  uses: jlumbroso/free-disk-space@main
      #  with:
      #    # this might remove tools that are actually needed,
      #    # if set to "true" but frees about 6 GB
      #    tool-cache: true
      #    # dotnet is needed later, so do not remove it
      #    dotnet: false

      - name: Set BUNDLE_NAME
        run: |
          short="${MOD#Cosmere}"
          short="${short,,}"
          echo "BUNDLE_NAME=cosmere.$short" >> $GITHUB_ENV
        env:
          MOD: ${{ matrix.mod }}

      - name: Checkout RimworldCosmere
        uses: actions/checkout@v4
        with:
          path: 'RimworldCosmere'

      - name: Checkout AssetBuilder
        uses: actions/checkout@v4
        with:
          repository: 'RimworldCosmere/AssetBuilder'
          path: 'AssetBuilder'

      - uses: actions/cache@v4
        with:
          path: 'AssetBuilder/Library'
          key: Library-${{ matrix.mod }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.mod }}-
            Library-

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: 9.0.x

      - name: Copy mod assets into AssetBuilder
        id: copyassets
        run: |
          destDir="AssetBuilder/Assets/Data/$BUNDLE_NAME"
          srcDir="RimworldCosmere/$MOD/Assets"
          if [ -d "$srcDir" ]; then
            echo "Copying assets from $srcDir to $destDir"
            mkdir -p "$destDir"
            cp -r "$srcDir/"* "$destDir"
            echo "hasAssets=true" >> $GITHUB_OUTPUT
          else
            echo "No assets to copy for $MOD (missing $srcDir)"
            echo "hasAssets=false" >> $GITHUB_OUTPUT
          fi

      # Build bundles for each target platform.  These steps mirror the
      # original prepare job but live in a standalone job so they can
      # complete before the mod build begins.
      - name: Build Windows AssetBundles
        if: steps.copyassets.outputs.hasAssets == 'true' && matrix.platform == 'windows'
        uses: game-ci/unity-builder@v4
        continue-on-error: false
        timeout-minutes: 30
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.35f1
          targetPlatform: StandaloneWindows64
          projectPath: AssetBuilder
          versioning: None
          allowDirtyBuild: true
          buildMethod: ModAssetBundleBuilder.BuildBundles
          customParameters: "-source=../RimworldCosmere/${{ matrix.mod }} -buildTarget=windows"

      - name: Build Mac AssetBundles
        if: steps.copyassets.outputs.hasAssets == 'true' && matrix.platform == 'mac'
        uses: game-ci/unity-builder@v4
        continue-on-error: false
        timeout-minutes: 30
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.35f1
          targetPlatform: StandaloneOSX
          projectPath: AssetBuilder
          versioning: None
          allowDirtyBuild: true
          buildMethod: ModAssetBundleBuilder.BuildBundles
          customParameters: "-source=../RimworldCosmere/${{ matrix.mod }} -buildTarget=mac"

      - name: Build Linux AssetBundles
        if: steps.copyassets.outputs.hasAssets == 'true' && matrix.platform == 'linux'
        uses: game-ci/unity-builder@v4
        continue-on-error: false
        timeout-minutes: 30
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.35f1
          targetPlatform: StandaloneLinux64
          projectPath: AssetBuilder
          versioning: None
          allowDirtyBuild: true
          buildMethod: ModAssetBundleBuilder.BuildBundles
          customParameters: "-source=../RimworldCosmere/${{ matrix.mod }} -buildTarget=linux"

      # Package the AssetBundles directory and upload it as an artifact.  The
      # prepare job will download and extract this archive before building
      # the mod.
      - name: Archive asset bundles
        if: steps.copyassets.outputs.hasAssets == 'true'
        run: |
          finalDir="RimworldCosmere/$MOD/AssetBundles"
          if [ -d "$finalDir" ]; then
            echo "Zipping built asset bundles from $finalDir"
            zip -r "$MOD-assetbundles-${{ matrix.platform }}.zip" "$finalDir"
          else
            echo "Expected asset bundles directory $finalDir not found!"
            exit 1
          fi

      - name: Upload asset bundles artifact
        if: steps.copyassets.outputs.hasAssets == 'true'
        uses: actions/upload-artifact@v4
        with:
          # Include platform in the artifact name so that prepare job can download
          # all variants (windows, mac, linux).
          name: ${{ matrix.mod }}-assetbundles-${{ matrix.platform }}
          path: ${{ matrix.mod }}-assetbundles-${{ matrix.platform }}.zip

  prepare:
    needs: [ get-mods, build-assetbundles ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mod: ${{ fromJson(needs.get-mods.outputs.mods) }}
    
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      MOD: ${{ matrix.mod }}
      BUNDLE_NAME: ${{ matrix.mod }}
      TEMP_DIR: "/tmp/${{ matrix.mod }}_upload"
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}

    steps:
      - name: Set BUNDLE_NAME
        run: |
          short="${MOD#Cosmere}"
          short="${short,,}"  # lowercase it
          echo "BUNDLE_NAME=cosmere.$short" >> $GITHUB_ENV
        env:
          MOD: ${{ matrix.mod }}

      - name: Checkout RimworldCosmere
        uses: actions/checkout@v4
        with:
          path: 'RimworldCosmere'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: 9.0.x

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install steamdown + steam-totp + Generator Dependencies
        working-directory: RimworldCosmere
        run: |
          npm install -g @steamdown/cli tsx
          cd .scripts && npm i

      - name: Run generators
        working-directory: RimworldCosmere
        run: npm --prefix .scripts start -- -d -f

      - name: Install Mod Dependencies
        working-directory: RimworldCosmere
        run: dotnet restore $MOD/$MOD

      - name: Set build configuration
        working-directory: RimworldCosmere
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "BUILD=Release" >> $GITHUB_ENV
          else
            echo "BUILD=Debug" >> $GITHUB_ENV
          fi

      # Download and extract asset bundles built in the previous job.  The
      # artifact contains a zip of the AssetBundles directory.  After
      # extraction the bundles live under RimworldCosmere/$MOD/AssetBundles
      # so that the packaging step will include them automatically.
      - name: Download asset bundles
        uses: actions/download-artifact@v4
        with:
          # Download all asset bundle artifacts for this mod (windows, mac and linux)
          pattern: ${{ matrix.mod }}-assetbundles-*
          path: RimworldCosmere/${{ matrix.mod }}
          merge-multiple: true

      - name: Extract asset bundles
        working-directory: RimworldCosmere/${{ matrix.mod }}
        run: |
          shopt -s nullglob
          for zipfile in ./*-assetbundles-*.zip; do
            echo "Extracting $zipfile"
            unzip -o "$zipfile" -d .
            rm "$zipfile"
          done
          shopt -u nullglob

      - name: Build Mod
        working-directory: RimworldCosmere
        if: ${{ github.event.release.tag_name != '' }}
        run: |
          TAG="${{ github.event.release.tag_name }}" # e.g. v1.6.0-beta or 1.6.0.1
          VERSION="${TAG#v}"                         # strip leading 'v'

          # Extract components with known-good format
          REGEX='^([0-9]+)\.([0-9]+)\.([0-9]+)(-alpha|-beta)?(\.[0-9]+)?$'
          [[ "$VERSION" =~ $REGEX ]]

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          LABEL="${BASH_REMATCH[4]#-}"         # optional, strip leading dash
          REVISION="${BASH_REMATCH[5]#.}"      # optional, strip leading dot
          [[ -z "$REVISION" ]] && REVISION="0" # default REVISION to `0`

          CONFIG="Debug"
          [[ -z "$LABEL" && "${GITHUB_REF_NAME}" == "main" ]] && CONFIG="Release"

          BUILD_VERSION="$MAJOR.$MINOR.$PATCH"
          [[ -n "$REVISION" ]] && BUILD_VERSION+=".$REVISION"
          [[ -n "$LABEL" ]] && BUILD_VERSION+="-${LABEL}"

          echo "Running script generation"

          echo "Building $MOD@$BUILD_VERSION ($CONFIG)"

          dotnet build $MOD/$MOD \
            --configuration "$CONFIG" \
            -p:Version="$BUILD_VERSION" \
            -p:FileVersion="$BUILD_VERSION" \
            -p:AssemblyVersion="$MAJOR.$MINOR.$PATCH.0" \
            -p:InformationalVersion="$BUILD_VERSION" \
            --no-restore

      - name: Build Mod
        if: ${{ github.ref_type != 'tag' }}
        working-directory: RimworldCosmere
        run: dotnet build $MOD/$MOD --configuration Debug --no-restore

      - name: Prepare upload directory
        id: prepare
        working-directory: RimworldCosmere
        run: |
          FILE_ID="$(cat About/PublishedFileId.txt 2>/dev/null || printf '')"
          DESCRIPTION_FILE="$TEMP_DIR/steam_description.txt"

          mkdir -p "$TEMP_DIR"

          echo "📄 Generating description..."
          cat "$MOD/README.md" | steamdown > "$DESCRIPTION_FILE"

          echo "🚫 Respecting .steamignore..."
          if [ -f "$MOD/.steamignore" ]; then
            rsync -av --exclude-from="$MOD/.steamignore" --exclude=".steamignore" "$MOD/" "$TEMP_DIR"
          else
            rsync -av "$MOD/" "$TEMP_DIR"
          fi

          CHANGE_NOTE=$(git log -1 --pretty=%B | sed 's/"/\\"/g')
          ESCAPED_DESCRIPTION=$(sed 's/"/\\"/g' "$DESCRIPTION_FILE")

          {
            echo '"workshopitem"'
            echo '{'
            echo '  "appid" "294100"'
            echo "  \"publishedfileid\" \"$FILE_ID\""
            echo "  \"contentfolder\" \"$TEMP_DIR\""
            echo "  \"changenote\" \"$CHANGE_NOTE\""
            echo "  \"description\" \"$ESCAPED_DESCRIPTION\""
            echo '}'
          } > "$TEMP_DIR/workshop.vdf"

          echo "✅ Generated workshop.vdf:"
          cat "$TEMP_DIR/workshop.vdf"
          
          ZIP_PATH="${{ github.workspace }}/${MOD}-${BRANCH_NAME}.zip"
          cd "$TEMP_DIR"
          zip -r "$ZIP_PATH" .
          
          echo "vdfpath=$TEMP_DIR/workshop.vdf" >> "$GITHUB_OUTPUT"

      - name: Setup SteamCMD
        id: steam-setup
        uses: CyberAndrii/setup-steamcmd@v1
      
      #      - name: Config SteamCMD
      #        run: |
      #          mkdir -p ${{ steps.steam-setup.outputs.directory }}/config
      #          echo "${{ secrets.STEAM_VDF }}" | base64 -d > ${{ steps.steam-setup.outputs.directory }}/config/config.vdf
      #          chmod 777 ${{ steps.steam-setup.outputs.directory }}/config/config.vdf

      - uses: CyberAndrii/steam-totp@v1
        name: Generate TOTP
        id: steam-totp
        with:
          shared_secret: ${{ secrets.STEAM_SHARED_SECRET }}

      - name: Test SteamCMD
        run: |
          echo "${{ steps.steam-totp.outputs.code }}"
          steamcmd +login "$STEAM_USERNAME" "$STEAM_PASSWORD" "${{ steps.steam-totp.outputs.code }}" +quit

      - name: Upload with SteamCMD
        if: ${{ github.event_name == 'release' && !endsWith(github.event.release.tag_name, '-beta') && !endsWith(github.event.release.tag_name, '-alpha') }}
        run: ~/steamcmd/steamcmd.sh +login "$STEAM_USERNAME" "$STEAM_PASSWORD" ${{ steps.steam-totp.outputs.code }} +workshop_build_item "${{ steps.prepare.outputs.vdfpath }}" +quit

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mod }}-zip
          path: ${{ github.workspace }}/${{ matrix.mod }}-${{ env.BRANCH_NAME }}.zip
  
  semantic-release:
    needs: prepare
    if: needs.prepare.result == 'success' && github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Download all zip artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-zip'
          path: ./zips
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          npm install @semantic-release/git semantic-release-replace-plugin -D
          npx semantic-release