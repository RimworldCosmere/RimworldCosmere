StylesPath = Styles
MinAlertLevel = warning

Packages = Google

Vocab = Cosmere

[*.md]
BasedOnStyles = Vale, Google, RimWorks

# Headings here are sentence case, which Google agrees with, but the rule fires on
# type names like Metalmind that have to keep their casing.
Google.Headings = NO

# These docs are for mod authors reading alongside an IDE. "will" is fine.
Google.Will = NO

# Reads a dotted identifier such as Cosmere.Core as two sentences and asks for a space
# between them.
Google.Spacing = NO

# Matches any word ending in "ly" before a hyphen, so it rejects correct compounds
# such as assembly-qualified.
Google.LyHyphens = NO

# Fires on a capitalised link title after a colon.
Google.Colons = NO

# Vocabulary terms are flagged when a sentence starts with one, because
# sentence-initial capitals read as inconsistent casing.
Vale.Terms = NO

# One maintainer writes these docs and speaks as himself in them. "We", "I" and the odd
# exclamation mark are the register, not a slip.
Google.We = NO
Google.FirstPerson = NO
Google.Exclamation = NO

# Every Cosmere*/README.md is generated from README.header.md, README.template.md and
# README.footer.md by semantic-release-steam. Fix the sources, not the output.
[Cosmere*/README.md]
BasedOnStyles =

# Licence text is not ours to rewrite.
[LICENSE*.md]
BasedOnStyles =

# *.local.md is one person's untracked scratch notes, not prose anyone else reads.
[*.local.md]
BasedOnStyles =

# README.header.md and README.footer.md are Steam store copy. "We", "you" and an
# exclamation mark are the register that page wants.
[.github/README.*.md]
BasedOnStyles =

# Each Cosmere*/README.template.md is the same store copy, one mod at a time.
[Cosmere*/README.template.md]
BasedOnStyles =

# An issue form talks to the reporter, so first and second person are the point.
[.github/ISSUE_TEMPLATE/*.md]
BasedOnStyles =

# Agent scratch reports, not prose anyone reads twice.
[.superpowers/**]
BasedOnStyles =

# "Content Type" here heads a licence table column. The rule means an HTTP media type.
[README.md]
Google.WordListCase = NO

# A bold list label runs into the bullets under it, so the counter reads one long sentence.
[chipping-in.md]
RimWorks.SentenceLength = NO
